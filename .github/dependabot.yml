version: 2

updates:
  # Targets pyproject.toml and uv.lock, which are the files a human edits and
  # reviews. Deliberately NOT the pip ecosystem: that picks up requirements.txt,
  # which is a lockfile generated by hatch-pip-compile. Dependabot bumping one
  # pinned line at a time in a generated file fights the generator, can leave it
  # internally inconsistent, and produced 15 stale PRs that all proposed
  # downgrades by the time anyone looked. Regenerate it with `hatch run update`.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Conventional Commits: CI rejects a PR title without a recognised prefix,
    # and release-please reads the prefix to decide the version.
    commit-message:
      prefix: "deps"
      prefix-development: "deps"
    groups:
      # One PR per batch rather than one per package, so review is a single pass
      # and the lockfile stays internally consistent.
      production-dependencies:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      development-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]

  # Action versions in the workflows, including the release pipeline.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns: ["*"]
