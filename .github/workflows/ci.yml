name: "Python CI"

on:
  # Run on all branch pushes to ensure tests always run
  push:
  # All pull requests trigger the workflow
  pull_request:

jobs:
  ansible-lint:
    name: "Ansible - Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ansible-lint
        run: pipx install ansible-lint && pipx inject ansible-lint ansible-core

      - name: Install collections
        run: ansible-galaxy collection install -r ansible/requirements.yml

      - name: Lint the deployment roles
        working-directory: ansible
        run: ansible-lint --offline

  linters:
    name: "Code Quality - Linting"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python
        run: uv python install 3.11

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies
        run: uv pip install -e .[dev,test]

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Type check with mypy
        run: uv run mypy src/

  build:
    needs: [linters]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies
        run: uv pip install -e .[dev,test]

      - name: Run tests
        run: uv run pytest tests/ --cov --cov-branch --cov-report=xml

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      # Build check only. The artifact that ships is built from the tag by
      # release.yml, which is the single PyPI publisher.
      - name: Build package
        run: uv build

