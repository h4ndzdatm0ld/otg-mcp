name: Docker

on:
  # Run on all branch pushes to ensure tests always run
  push:
  # All pull requests trigger the workflow
  pull_request:
  release:
    types: [published]

permissions:
  contents: read
  packages: write  # Required for pushing to GitHub Container Registry

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build Docker Image
    steps:
    - uses: actions/checkout@v4

    - name: Test Dockerfile syntax
      run: docker run --rm -i hadolint/hadolint < Dockerfile || echo "Dockerfile lint warnings found"
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Extract metadata for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository_owner }}/otg-mcp
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=sha,format=short
    
    - name: Login to GitHub Container Registry
      # Only login for pushes to main or releases
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    # Build into the local daemon first so the image can actually be run and
    # verified before anything is published. Shares the same layer cache as the
    # publish step below, so this costs little.
    - name: Build image locally for verification
      uses: docker/build-push-action@v5
      with:
        context: .
        load: true
        tags: otg-mcp:ci
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # A build that succeeds can still ship a server that registers no tools, so
    # start the MCP server inside the image and assert every expected tool name
    # comes back over stdio. Runs entirely in the container, which already has
    # the mcp client library and the test script.
    - name: Verify MCP server exposes all expected tools
      run: |
        docker run --rm otg-mcp:ci \
          python tests/docker/assert_tools.py -- \
          python -m otg_mcp --config-file examples/trafficGeneratorConfig.json

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        # We only push on main branch or for tagged releases
        push: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
