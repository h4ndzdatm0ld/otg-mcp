name: Release

# Versioning is derived from Conventional Commits by release-please, so nobody
# edits pyproject.toml by hand and nobody guesses a number.
#
# How it flows:
#   1. A merge to main lands a `feat:` / `fix:` commit.
#   2. release-please opens (or updates) a release PR that bumps
#      pyproject.toml and writes CHANGELOG.md.
#   3. Merging that PR creates the tag and the GitHub Release.
#   4. The publish jobs below run in that same workflow run and ship the PyPI
#      and Docker artifacts.
#
# Publishing lives here rather than relying on the `release: published` triggers
# in ci.yml and docker.yml, because a release created by this workflow's
# GITHUB_TOKEN does not trigger other workflows. Those triggers are kept so a
# manually published release still ships.
#
# fix: -> patch, feat: -> minor, `!` or a BREAKING CHANGE footer -> major (while
# below 1.0.0 a breaking change bumps the minor, per bump-minor-pre-major). A
# commit that is not conventional produces no release, which is intended: not
# every merge deserves a version.

on:
  # Gated on CI rather than on the push itself: a workflow triggered directly by
  # a push runs regardless of whether the tests passed, so a failing merge could
  # be tagged and published to PyPI and GHCR. workflow_run fires only after
  # "Python CI" completes, and the job below refuses anything but success.
  workflow_run:
    workflows: ["Python CI"]
    types: [completed]
    branches: [main]
  # Lets you cut a release from history that predates Conventional Commits,
  # without inventing a commit to trigger it.
  workflow_dispatch:

# Never let two merges race the release PR or the tag.
concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Prepare release
    runs-on: ubuntu-latest
    # A manual run is an explicit decision; an automatic one must follow green CI.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      pr_branch: ${{ fromJSON(steps.release.outputs.pr || '{}').headBranchName }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # uv.lock records otg-mcp's own version, and release-please only rewrites
  # pyproject.toml, so a release PR would otherwise ship a lockfile still
  # pinning the previous version.
  sync-lockfile:
    name: Sync uv.lock in the release PR
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.pr_branch != ''
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.pr_branch }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Refresh the lockfile
        run: uv lock

      - name: Commit if the lockfile moved
        run: |
          set -euo pipefail
          if git diff --quiet -- uv.lock; then
            echo "uv.lock already matches pyproject.toml"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore: sync uv.lock with the released version"
          git push

  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build
        run: uv build

      - name: Publish
        run: uv publish -t ${{ secrets.PYPI_API_TOKEN }}

  docker:
    name: Publish Docker image
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/otg-mcp
          # release-please produces stable semver, so latest always points at a
          # real release. docker.yml owns the moving dev tags.
          tags: |
            # Always present: type=semver silently skips a value it considers
            # invalid semver, and with latest disabled for pre-releases that
            # would leave the push with no tag whatsoever.
            type=raw,value=${{ needs.release-please.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.tag }}
            type=raw,value=latest

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same guard as docker.yml: an image that builds can still ship a server
      # that registers no tools, so verify the tool surface before pushing.
      - name: Build image locally for verification
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: otg-mcp:release-check
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify MCP server exposes all expected tools
        run: |
          docker run --rm otg-mcp:release-check \
            python tests/docker/assert_tools.py -- \
            python -m otg_mcp --config-file examples/trafficGeneratorConfig.json

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
