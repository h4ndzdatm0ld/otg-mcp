name: Release

# Versioning is derived from Conventional Commits by release-please, so nobody
# edits pyproject.toml by hand and nobody guesses a number.
#
# How it flows:
#   1. A merge to main lands a `feat:` / `fix:` commit.
#   2. release-please opens (or updates) a release PR that bumps
#      pyproject.toml and writes CHANGELOG.md.
#   3. Merging that PR creates the tag and the GitHub Release.
#   4. The publish jobs below run in that same workflow run and ship the PyPI
#      and Docker artifacts.
#
# Publishing lives here rather than relying on the `release: published` triggers
# in ci.yml and docker.yml, because a release created by this workflow's
# GITHUB_TOKEN does not trigger other workflows. Those triggers are kept so a
# manually published release still ships.
#
# fix: -> patch, feat: -> minor, `!` or a BREAKING CHANGE footer -> major (while
# below 1.0.0 a breaking change bumps the minor, per bump-minor-pre-major). A
# commit that is not conventional produces no release, which is intended: not
# every merge deserves a version.

on:
  push:
    branches: [main]
  # Lets you cut a release from history that predates Conventional Commits,
  # without inventing a commit to trigger it.
  workflow_dispatch:

# Never let two merges race the release PR or the tag.
concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Build
        run: uv build

      - name: Publish
        run: uv publish -t ${{ secrets.PYPI_API_TOKEN }}

  docker:
    name: Publish Docker image
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/otg-mcp
          # release-please produces stable semver, so latest always points at a
          # real release. docker.yml owns the moving dev tags.
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.tag }}
            type=raw,value=latest

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same guard as docker.yml: an image that builds can still ship a server
      # that registers no tools, so verify the tool surface before pushing.
      - name: Build image locally for verification
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: otg-mcp:release-check
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify MCP server exposes all expected tools
        run: |
          docker run --rm otg-mcp:release-check \
            python tests/docker/assert_tools.py -- \
            python -m otg_mcp --config-file examples/trafficGeneratorConfig.json

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
